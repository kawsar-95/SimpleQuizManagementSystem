plugins {
    id 'java'
    id 'application'
}

group = 'com.quizms'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Minimal JSON library for reading/writing users.json and quiz.json
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'

    // Unit tests
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
}

application {
    mainClass = 'com.quizms.Main'
}

// Build a "fat" runnable jar with dependencies shaded in.
jar {
    manifest {
        attributes 'Main-Class': 'com.quizms.Main'
    }
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Make `gradle run` use UTF-8 so the console matches source files cleanly.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.withType(Test).configureEach {
    systemProperty 'file.encoding', 'UTF-8'
    useJUnitPlatform()
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = false
    }
}
